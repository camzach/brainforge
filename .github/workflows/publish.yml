name: Publish to GitHub Pages
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY: ${{ secrets.R2_KEY || 'keyforge.db.zst' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get R2 object ETag
        id: r2_etag
        run: |
          ETAG=$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$R2_KEY" \
            --query 'ETag' \
            --output text | tr -d '"')
          echo "etag=$ETAG" >> "$GITHUB_OUTPUT"

      - name: Restore cached keyforge.db
        id: cache_db
        uses: actions/cache@v4
        with:
          path: keyforge.db
          key: keyforge-db-${{ steps.r2_etag.outputs.etag }}

      - name: Download source DB
        if: steps.cache_db.outputs.cache-hit != 'true'
        run: aws s3 cp "s3://$R2_BUCKET/$R2_KEY" - | zstd -d -o keyforge.db

      - name: Restore cached card images
        uses: actions/cache@v4
        with:
          path: public/card-images
          key: card-images-${{ steps.r2_etag.outputs.etag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          SOURCE_DB_PATH: keyforge.db

      - name: Create SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
